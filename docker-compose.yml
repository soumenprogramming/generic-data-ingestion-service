services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ingestion
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ingestion
      SPRING_DATASOURCE_USERNAME: ingestion
      SPRING_DATASOURCE_PASSWORD: ingestion
      NASA_API_KEY: DEMO_KEY
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
